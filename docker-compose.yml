version: '3.8'

services:
  tensorrt-llm:
    image: nvcr.io/nvidia/tritonserver:24.06-trtllm-py3
    container_name: trtllm-server
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      - TRT_TP_SIZE=8
    ports:
      - "8001:8001"
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 8
              capabilities: [gpu]
